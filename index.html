<!DOCTYPE html>

  <title>Royal 3 Cards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="game">
    <h1>👑 Royal 3 Cards</h1>

  </div>

  <script src="game.js"></script>

</html>
